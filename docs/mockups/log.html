for (const p of D.people) bySlice[p.slice]?.visits.push(p);
for (const m of D.marks) {
  const b = bySlice[m.slice]; if (!b) continue;
  ({ create_post: b.posts, create_comment: b.comments, like_post: b.likes })[m.kind].push(m);
}
for (const [pid, list] of Object.entries(D.withheld)) for (const w of list) if (bySlice[w.slice]) bySlice[w.slice].withheld += w.n;

const quote = (text) => {
  const long = text.length > 140;
  return `<p class="quote${long ? ' clip' : ''}">${esc(text)}</p>${long ? '<button class="more" type="button">展开全文</button>' : ''}`;
};

function visit(p) {
  const [word, cls] = OUT[p.outcome] ?? [p.outcome, ''];
  const read = [...new Set(D.links.filter((l) => l.to === p.id).map((l) => l.from))];
  const sat = avg(p.steps.map((s) => s.sat).filter((v) => v != null));
  const before = read.length ? `来之前读了 ${read.map(name).join('、')} 的帖子` : '来的时候社区里还没有帖子';
  const facts = [`${p.steps.length} 步`, sat && `满意度 ${sat}`, p.nps != null && `推荐 ${p.nps}/10`].filter(Boolean).join(' · ');
  return `<div class="ev visit">
    <div class="line"><span class="who">${name(p.id)}</span> 来用产品，<span class="${cls}">${word}</span></div>
    <div class="meta">${esc(P[p.id].job)}，${p.age} 岁 · ${before} · ${facts}</div>
    ${p.outcome !== 'success' && p.reason ? `<div class="meta">${esc(p.reason)}</div>` : ''}
  </div>`;
}

// 同一个人再发一遍同样的话：只写一行，不重复原文
const seen = {};
function said(m, verb, target) {
  const key = `${m.pid}
${m.body}`;
  const n = seen[key] = (seen[key] ?? 0) + 1;
  if (n > 1) return `<div class="minor">${name(m.pid)} 又${verb}${target}，内容和之前一样（第 ${n} 次）</div>`;
  return `<div class="ev"><span class="who">${name(m.pid)}</span> ${verb}${target}${quote(m.body)}</div>`;
}
let html = '', lastDay = null, quiet = 0;
const flushQuiet = (endSlice) => {
  if (!quiet) return;
  html += `<div class="quiet">${quiet === 1 ? hhmm(endSlice - 1) : `${hhmm(endSlice - quiet)}–${hhmm(endSlice - 1)}`} 没有人来，社区里也没人说话</div>`;
  quiet = 0;
};
bySlice.forEach((b, i) => {
  const day = dayOf(i);
  const talk = b.visits.length || b.posts.length || b.comments.length;
  if (day !== lastDay) { flushQuiet(i); html += `<div class="day">${day}</div>`; lastDay = day; }
  if (!talk) { quiet++; return; }
  flushQuiet(i);
  const ev = [
    ...b.visits.map(visit),
    ...b.posts.map((m) => said(m, '发帖', '')),
    ...b.comments.map((m) => said(m, '评论', m.to ? ` ${name(m.to)} 的帖子` : '')),
  ];
  const minor = [b.likes.length && `${[...new Set(b.likes.map((m) => name(m.pid)))].join('、')} 点了赞`, b.withheld && `${b.withheld} 条想法没有说出口`].filter(Boolean);
  if (minor.length) ev.push(`<div class="minor">${minor.join('；')}</div>`);
  html += `<section class="hour"><div class="t">${hhmm(i)}</div><div class="events">${ev.join('')}</div></section>`;
});
flushQuiet(D.slices);
$('log').innerHTML = html;

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('more')) {
    const q = e.target.previousElementSibling; const open = q.classList.toggle('clip');
    e.target.textContent = open ? '展开全文' : '收起';
  }
});
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
</script>
</body>
</html>
