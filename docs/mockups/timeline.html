<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行时刻表 · 草图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3efe6; --paper-2: #ebe5d8; --ink: #1c1a16; --ink-2: #57524a; --ink-3: #8f887b; --rule: #d6cfc0; --rule-2: #c3baa8;
  --signal: #c2412d; --link: #3d5a80; --good: #2f6b4f; --warn: #b07a1c;
  --serif: "Noto Serif SC", "Songti SC", serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16150f; --paper-2: #1f1d17; --ink: #ece6d8; --ink-2: #b4ac9c; --ink-3: #7c7567; --rule: #2e2b23; --rule-2: #403b31;
    --signal: #e0644d; --link: #7fa3cf; --good: #6fb48f; --warn: #d9a548;
  }
}
:root[data-theme="dark"] {
  --paper: #16150f; --paper-2: #1f1d17; --ink: #ece6d8; --ink-2: #b4ac9c; --ink-3: #7c7567; --rule: #2e2b23; --rule-2: #403b31;
  --signal: #e0644d; --link: #7fa3cf; --good: #6fb48f; --warn: #d9a548;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 var(--sans); }
.wrap { max-width: 1480px; margin: 0 auto; padding: 28px 24px 48px; }

/* 页头：像实验记录的抬头，一行事实，不要宣传语 */
.masthead { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
.masthead h1 { font: 700 28px/1.2 var(--serif); margin: 0; letter-spacing: .01em; }
.masthead .id { font: 12px var(--mono); color: var(--ink-3); }
.ledger { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0; font: 12px var(--mono); color: var(--ink-2); }
.ledger span { padding-right: 14px; margin-right: 14px; border-right: 1px solid var(--rule-2); }
.ledger span:last-child { border: 0; }
.ledger b { color: var(--ink); font-weight: 600; }
.theme { font: 12px var(--mono); background: none; border: 1px solid var(--rule-2); color: var(--ink-2); padding: 3px 8px; cursor: pointer; }

/* 时钟条 */
.clock { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; font: 12px var(--mono); color: var(--ink-2); }
.clock button { font: 12px var(--mono); background: var(--ink); color: var(--paper); border: 0; padding: 4px 10px; cursor: pointer; }
.clock input { flex: 1; accent-color: var(--signal); }
.clock .now { min-width: 120px; color: var(--ink); }

/* 图例：用文字说清楚，不靠颜色猜 */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); margin: 0 0 10px; }
.legend i { display: inline-block; vertical-align: -2px; margin-right: 6px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; border-top: 1px solid var(--rule-2); }
.chart { overflow-x: auto; border-right: 1px solid var(--rule-2); }
svg { display: block; }
.row-label { font: 600 13px var(--serif); fill: var(--ink); }
.row-sub { font: 11px var(--mono); fill: var(--ink-3); }
.axis { font: 10.5px var(--mono); fill: var(--ink-3); }
.row-hit { fill: transparent; cursor: pointer; }
.row-hit:hover, .row-hit.on { fill: var(--paper-2); }

/* 侧栏：档案卡，不是 SaaS 卡片 */
.side { padding: 16px 18px; font-size: 13px; }
.side h2 { font: 700 20px/1.3 var(--serif); margin: 0; }
.side .meta { font: 12px var(--mono); color: var(--ink-3); margin: 4px 0 12px; }
.side dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; margin: 0 0 14px; }
.side dt { color: var(--ink-3); }
.side dd { margin: 0; }
.side h3 { font: 600 12px var(--mono); color: var(--ink-3); letter-spacing: .08em; margin: 18px 0 6px; border-top: 1px solid var(--rule); padding-top: 10px; }
.quote { font: 14px/1.7 var(--serif); margin: 0 0 10px; padding-left: 10px; border-left: 2px solid var(--ink); }
.quote small { display: block; font: 11px var(--mono); color: var(--ink-3); }
.empty { color: var(--ink-3); font-style: italic; }
.ok { color: var(--good); } .bad { color: var(--signal); } .mid { color: var(--warn); }
.hint { color: var(--ink-3); font-size: 12px; margin-top: 10px; }
@media (max-width: 900px) { .board { grid-template-columns: 1fr; } .chart { border-right: 0; } .side { border-top: 1px solid var(--rule-2); } }
</style>
</head>

</div>

const W = LABEL + COL * D.slices + 16, H = TOP + ROW * people.length + 10;
const x = (slice) => LABEL + slice * COL;
const rowOf = Object.fromEntries(people.map((p, i) => [p.id, i]));
const yMid = (pid) => TOP + rowOf[pid] * ROW + ROW / 2;

const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, $('chart'));
// 网格：只有细线
for (let i = 0; i <= D.slices; i++) {
  el('line', { x1: x(i), x2: x(i), y1: TOP - 6, y2: H - 10, stroke: 'var(--rule)', 'stroke-width': i % 6 === 0 ? 1 : 0.5 }, svg);
  if (i < D.slices && i % 2 === 0) el('text', { x: x(i) + 3, y: TOP - 12, class: 'axis' }, svg).textContent = hourLabel(i);
}
const hits = {};
people.forEach((p, i) => {
  const y0 = TOP + i * ROW;
  const hit = el('rect', { x: 0, y: y0, width: W, height: ROW, class: 'row-hit' }, svg);
  hit.addEventListener('click', () => select(p.id));
  hits[p.id] = hit;
  el('line', { x1: 0, x2: W, y1: y0 + ROW, y2: y0 + ROW, stroke: 'var(--rule)', 'stroke-width': 0.6 }, svg);
  el('text', { x: 8, y: y0 + 24, class: 'row-label' }, svg).textContent = `${p.name}`;
  el('text', { x: 8, y: y0 + 41, class: 'row-sub' }, svg).textContent = `${p.id} · ${PART[p.part] ?? p.part} · ${p.age}岁`;
  const nRead = new Set(D.links.filter((l) => l.to === p.id).map((l) => l.post)).size;
  if (nRead) el('text', { x: 8, y: y0 + 54, class: 'row-sub', fill: 'var(--link)' }, svg).textContent = `来之前读过 ${nRead} 帖`;
});

// 动态层：随时钟重画
const layer = el('g', {}, svg);
const cursor = el('line', { y1: TOP - 6, y2: H - 10, stroke: 'var(--signal)', 'stroke-width': 1.5 }, svg);

function draw(t) {
  layer.innerHTML = '';
  // 在社区里（活跃的时间片）：行底的一段粗线
  for (const a of D.active) {
    if (a.slice >= t || rowOf[a.pid] == null) continue;
    const y = yMid(a.pid) + 18;
    el('line', { x1: x(a.slice) + 3, x2: x(a.slice) + COL - 3, y1: y, y2: y, stroke: 'var(--ink-3)', 'stroke-width': 2, opacity: .55 }, layer);
  }
  // 影响线：作者发帖的位置 → 读者开始体验的位置
  for (const l of D.links) {
    const post = D.marks.find((m) => m.kind === 'create_post' && m.post === l.post);
    const reader = people.find((p) => p.id === l.to);
    if (!post || !reader || reader.slice >= t || rowOf[l.from] == null) continue;
    const x1 = x(post.slice) + COL / 2, y1 = yMid(l.from) - 12, x2 = x(reader.slice) + 4, y2 = yMid(l.to) - 6;
    el('path', { d: `M${x1} ${y1} C ${x1 + 30} ${y1}, ${x2 - 30} ${y2}, ${x2} ${y2}`, fill: 'none', stroke: 'var(--link)', 'stroke-width': 1.1, opacity: 0, 'data-from': l.from, 'data-to': l.to, class: 'link' }, layer);
  }
  // 浏览块：一格宽，竖纹是每一步
  for (const p of people) {
    if (p.slice >= t) continue;
    const y = yMid(p.id), bx = x(p.slice) + 2, bw = COL - 4, by = y - 14, bh = 28;
    const frac = Math.min(1, t - p.slice); // 回放时块从左往右长出来
    const g = el('g', {}, layer);
    const n = Math.max(p.steps.length, 1), shown = Math.ceil(n * frac);
    p.steps.slice(0, shown).forEach((s, k) => {
      const sx = bx + (k / n) * bw, sw = Math.max(bw / n - 0.6, 0.6);
      const sat = s.sat ?? 3, h = (sat / 5) * bh;
      el('rect', { x: sx, y: by + bh - h, width: sw, height: h, fill: (s.conf ?? 1) >= 4 ? 'var(--signal)' : 'var(--ink)', opacity: s.sat == null ? .25 : .82 }, g);
    });
    const dash = p.outcome === 'abandoned' ? '3 2' : p.outcome === 'failed' ? '1 2' : null;
    el('rect', { x: bx - 1, y: by - 1, width: bw * frac + 2, height: bh + 2, fill: 'none', stroke: p.outcome === 'failed' ? 'var(--signal)' : 'var(--ink)', 'stroke-width': 1.2, ...(dash ? { 'stroke-dasharray': dash } : {}) }, g);
  }
  // 公开互动
  const stack = {};
  for (const m of D.marks) {
    if (m.slice >= t || rowOf[m.pid] == null) continue;
    const key = `${m.pid}:${m.slice}`; const k = stack[key] = (stack[key] ?? -1) + 1;
    const cx = x(m.slice) + 8 + k * 9, cy = yMid(m.pid) - 22;
    if (m.kind === 'create_post') el('rect', { x: cx - 4, y: cy - 4, width: 8, height: 8, fill: 'var(--ink)' }, layer);
    else if (m.kind === 'create_comment') el('circle', { cx, cy, r: 4, fill: 'var(--ink)' }, layer);
    else el('path', { d: `M${cx - 3.5} ${cy + 3} L${cx} ${cy - 4} L${cx + 3.5} ${cy + 3}`, fill: 'none', stroke: 'var(--ink-2)', 'stroke-width': 1.4 }, layer);
  }
  // 想说没说：行底的红色空心记号，数量写在旁边
  for (const [pid, list] of Object.entries(D.withheld)) {
    for (const w of list) {
      if (w.slice >= t || rowOf[pid] == null) continue;
      const cx = x(w.slice) + COL - 10, cy = yMid(pid) + 18;
      el('circle', { cx, cy, r: 3.5, fill: 'var(--paper)', stroke: 'var(--signal)', 'stroke-width': 1.3 }, layer);
      if (w.n > 1) el('text', { x: cx + 5, y: cy + 3.5, class: 'axis', fill: 'var(--signal)' }, layer).textContent = w.n;
    }
  }
  cursor.setAttribute('x1', x(t)); cursor.setAttribute('x2', x(t));
  $('now').textContent = t >= D.slices ? '已结束' : `模拟时间 ${hourLabel(Math.floor(t))}`;
  highlight();
}

// —— 档案侧栏 ——
let selected = null;
function select(pid) { selected = selected === pid ? null : pid; renderSide(); highlight(); }
function highlight() {
  for (const [pid, h] of Object.entries(hits)) h.classList.toggle('on', pid === selected);
  for (const l of layer.querySelectorAll('.link')) {
    const on = selected && (l.dataset.from === selected || l.dataset.to === selected);
    l.setAttribute('opacity', on ? .9 : 0);
    l.setAttribute('stroke-width', on ? 2 : 1.1);
  }
}
function renderSide() {
  const side = $('side');
  if (!selected) {
    side.innerHTML = `<h2>点一行看这个人</h2><p class="hint">每一行是一个人，从左到右是模拟的 24 小时。他在哪个小时来用产品、浏览了几步、每一步满不满意、之后在社区里说了什么、没说什么，都在这一行上。</p>
      <p class="hint">蓝色细线连到别人发的帖子：这个人来用产品之前，先在社区里读到了这些帖子。拖动上方的时钟或点“回放”，可以看到这一天是怎么一步步发生的。</p>`;
    return;
  }
  const p = people.find((q) => q.id === selected);
  const [outText, outCls] = OUT[p.outcome] ?? [p.outcome, ''];
  const read = D.links.filter((l) => l.to === p.id).map((l) => people.find((q) => q.id === l.from)?.name).filter(Boolean);
  const readBy = D.links.filter((l) => l.from === p.id).map((l) => people.find((q) => q.id === l.to)?.name).filter(Boolean);
  const said = D.marks.filter((m) => m.pid === p.id && m.kind !== 'like_post' && m.body);
  const held = (D.withheld[p.id] ?? []).reduce((s, w) => s + w.n, 0);
  const sats = p.steps.map((s) => s.sat).filter((v) => v != null);
  side.innerHTML = `
    <h2>${p.name}</h2>
    <div class="meta">${p.id} · ${p.job} · ${p.age} 岁</div>
    <dl>
      <dt>来访</dt><dd>${hourLabel(p.slice)}（第 ${p.slice + 1} 小时）</dd>
      <dt>结果</dt><dd class="${outCls}">${outText}　<span class="row-sub">${p.steps.length} 步</span></dd>
      <dt>满意度</dt><dd>${sats.length ? (sats.reduce((a, b) => a + b, 0) / sats.length).toFixed(1) + ' / 5' : '—'}</dd>
      <dt>推荐意愿</dt><dd>${p.nps ?? '—'}${p.nps != null ? ' / 10' : ''}</dd>
      <dt>发现</dt><dd>问题 ${p.issues} · 亮点 ${p.highlights}</dd>
      <dt>先读到</dt><dd>${read.length ? [...new Set(read)].join('、') : '<span class="empty">没人发过帖</span>'}</dd>
      <dt>被读到</dt><dd>${readBy.length ? [...new Set(readBy)].join('、') : '<span class="empty">—</span>'}</dd>
    </dl>
    ${p.outcome !== 'success' ? `<p class="hint">${p.reason}</p>` : ''}
    <h3>说出口的</h3>
    ${said.length ? said.map((m) => `<p class="quote">${m.body.replace(/</g, '&lt;')}<small>${m.kind === 'create_post' ? '发帖' : '评论'} · ${hourLabel(m.slice)}</small></p>`).join('') : '<p class="empty">没有公开发言</p>'}
    <h3>没说出口的</h3>
    <p>${held ? `${held} 条，原文只在报告里出现` : '<span class="empty">没有</span>'}</p>`;
}

// —— 时钟 ——
const range = $('t');
range.addEventListener('input', () => { stop(); draw(+range.value); });
let timer = 0;
function stop() { cancelAnimationFrame(timer); timer = 0; $('play').textContent = '▶ 回放'; }
$('play').addEventListener('click', () => {
  if (timer) return stop();
  let t = +range.value >= D.slices ? 0 : +range.value, last = performance.now();
  $('play').textContent = '❚❚ 暂停';
  const tick = (now) => { t += (now - last) / 1000 * 1.6; last = now; if (t >= D.slices) { t = D.slices; stop(); } range.value = t; draw(t); if (timer !== 0 || t < D.slices) timer = t < D.slices ? requestAnimationFrame(tick) : 0; };
  timer = requestAnimationFrame(tick);
});
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
draw(D.slices);
renderSide();
</script>
</body>
</html>
